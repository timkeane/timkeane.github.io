  <body class="loading">
    <h1 id="banner" onclick="window.location.href='./'">
      <img src="/sp/img/logo.jpg" alt="Sands Point Preserve Logo" />
      Sands Point Preserve
    </h1>
    <div id="root"></div>
    <iframe id="external-content" class="loading"></iframe>
    <button id="close-iframe" onclick="closeIframe()">Return to the Map</button>
    <script>

      const iframe = document.getElementById('external-content');
      const button = document.getElementById('close-iframe');

      iframe.onload = function() {
        iframe.className = '';
      };

      function closeIframe() {
        iframe.className = 'loading';
        iframe.style.display = 'none';
        button.style.display = 'none';
      }

      function handleExternalLinkClick(event) {
        event.preventDefault();
        const url = event.target.getAttribute('href');
        iframe.src = url;
        iframe.style.display = 'block';
        button.style.display = 'block';
      }

      const observer = new MutationObserver((mutationList, observer) => {
        for (const mutation of mutationList) {
          const externalLinks = document.getElementsByClassName('external');
          for (const link of externalLinks) {
            link.onclick = handleExternalLinkClick;
          }
        }
      });

      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
